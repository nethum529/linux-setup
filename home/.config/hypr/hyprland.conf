# ============================================================================
#  Hyprland config — tuned for this machine
#  ASUS laptop · AsusMuxDgpu mode · multi-GPU display split:
#    - eDP-1   (internal 2880x1800 panel)  -> NVIDIA RTX 4070  (pci 01:00.0)
#    - DP-11   (external 1920x1080)         -> AMD iGPU         (pci 65:00.0)
#    - DP-12   (external 1920x1080)         -> AMD iGPU         (pci 65:00.0)
#  Driver: nvidia-580xx-open-dkms (open module) · modeset already enabled.
#  This file only covers HARDWARE (monitors + GPU). Keybinds/bar/autostart
#  come from Ambxst once installed (see the `source` line at the bottom).
# ============================================================================

# ---------------------------------------------------------------------------
#  MULTI-GPU  (the critical bit). First device = primary renderer + allocator.
#  AMD (card0) first so the AMD-connected externals + GBM allocator work;
#  NVIDIA (card1) second to scan out the eDP-1 panel as a secondary GPU.
#
#  *** DO NOT use /dev/dri/by-path/pci-0000:... here. ***  Aquamarine splits
#  AQ_DRM_DEVICES on ":", and the PCI by-path names CONTAIN colons, so they get
#  shredded ("Failed to canonicalize path 00.0-card") -> no device opens ->
#  "Cannot open backend: no allocator available" -> Hyprland SIGABRT on launch
#  -> black screen. The colon-free symlinks below come from
#  /etc/udev/rules.d/99-hypr-gpu.rules (stable across card renumbering).
# ---------------------------------------------------------------------------
env = AQ_DRM_DEVICES,/dev/dri/amd-card:/dev/dri/nv-card

# ---------------------------------------------------------------------------
#  NVIDIA environment (open driver, Wayland)
# ---------------------------------------------------------------------------
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# NOTE: GBM_BACKEND=nvidia-drm is intentionally NOT set — on a hybrid AMD+NVIDIA
# box it can break the AMD side. Only add it if you go fully NVIDIA-primary.

# ---------------------------------------------------------------------------
#  MONITORS        name, resolution@refresh, position, scale
#  Positions below place the two externals side-by-side with the laptop panel
#  to their right. Adjust x-offsets to match your physical desk layout.
#  (`preferred` auto-picks the best mode incl. max refresh rate.)
# ---------------------------------------------------------------------------
monitor = DP-11, 1920x1080@143.99, 0x0,    1
monitor = DP-12, 1920x1080@143.99, 1920x0, 1
monitor = eDP-1, preferred,           3840x0, 1.5
# fallback for any other/unknown output
monitor = , preferred, auto, 1

# ---------------------------------------------------------------------------
#  Cursor — NVIDIA can show an invisible/glitched HW cursor. `2` = auto-detect
#  (Hyprland disables HW cursors on NVIDIA automatically). Force `true` if the
#  cursor disappears.
# ---------------------------------------------------------------------------
cursor {
    no_hardware_cursors = 2
}

# ---------------------------------------------------------------------------
#  Minimal usable defaults so a bare Hyprland session (BEFORE Ambxst) is
#  testable. Ambxst will layer its own keybinds/bar/autostart on top.
# ---------------------------------------------------------------------------
$mod = SUPER
$term = kitty

bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,   # quit Hyprland (moved off Super+Shift+E — that's now hyprshell reverse-switch)
# Super+C (toggle floating) — provided by Ambxst at runtime; a duplicate here
# double-fired and cancelled itself out, so it's intentionally omitted.
bind = $mod, F, fullscreen,
# move focus — provided by Ambxst at runtime (Super+arrows); a duplicate here
# caused the focus to double-fire and snap back, so it's intentionally omitted.
# workspaces 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# polkit auth agent (so apps can request privileges)
exec-once = systemctl --user start hyprpolkitagent

# Solaar daemon — applies MX Master 4 button rules + thumb-wheel divert.
# Hyprland doesn't honour XDG ~/.config/autostart/*.desktop (the session isn't
# systemd-managed), so the daemon MUST be launched here or the mouse keybinds
# revert to defaults on every boot.
exec-once = solaar --window=hide

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

# ---------------------------------------------------------------------------
#  Ambxst integration — uncomment AFTER running:
#     curl -L get.axeni.de/ambxst | sh   &&   ambxst install hyprland
#  (it drops its own Hyprland config; point this at whatever path it creates,
#   typically under ~/.config/ambxst/ or ~/.config/hypr/). Once Ambxst is in,
#  you can delete the minimal keybinds above to avoid duplicates.
# ---------------------------------------------------------------------------
# source = ~/.config/hypr/ambxst.conf

# Ambxst — autostart the Quickshell shell on login (verified rendering on all
# 3 monitors). `exec-once` is the reliable autostart; Ambxst applies its
# keybinds at runtime via Hyprland IPC, so the share-config source line below is
# left commented (Ambxst doesn't reliably generate it, and a missing file just
# throws a config-error overlay).
source = ~/.local/share/ambxst/hyprland.conf
# exec-once = ambxst  # removed: the sourced ambxst config above already has exec-once = ambxst (avoids double launch)

# OVERRIDES
# Down here you can write or source anything that you want to override from Ambxst's settings.
bind = CTRL, Return, exec, firefox --new-window
# NOTE: Super+W (close), Super+C (toggle floating) and Super+Tab (hyprexpo only) are
# defined in Ambxst's binds.json — Ambxst re-applies binds at runtime via axctl, which
# would clobber any static override here. Edit ~/.config/ambxst/binds.json instead.
# make the Ctrl+Return Firefox window appear instantly (skip the ~250ms pop-in animation)
windowrule = no_anim on, match:class firefox

# keep Firefox warm: at login, park a hidden instance on a special workspace so the
# process never exits (closing your normal windows won't kill it). This turns every
# Ctrl+Return into the ~200ms warm path instead of a ~1.1s cold start.
exec-once = [workspace special:ffwarm silent] firefox --new-window

# hyprshell — window switcher daemon (grabs Super+E itself via config.toml)
exec-once = hyprshell run

# touchpad: natural (reverse) scrolling
input {
    touchpad {
        natural_scroll = true
    }
}

# hyprexpo (workspace overview) — load enabled hyprpm plugins on startup
exec-once = hyprpm reload -n

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current
        keynav_reading_order = true
    }
}

# hyprexpo overview: open with Super+Tab AND enter the keyboard-nav submap
bind = $mod, Tab, hyprexpo:expo, toggle
bind = $mod, Tab, submap, expo

# alt-tab (normal mode): cycle to next window and raise it
bind = ALT, Tab, cyclenext
bind = ALT, Tab, alterzorder, top

# --- overview keyboard navigation (only active while the overview is open) ---
submap = expo
# hold Super, tap Tab to step forward (Super+Shift+Tab back) — alt-tab feel
bind  = SUPER, Tab,       hyprexpo:kb_focus, right
bind  = SUPER SHIFT, Tab, hyprexpo:kb_focus, left
# arrows move around the grid
bind  = , right, hyprexpo:kb_focus, right
bind  = , left,  hyprexpo:kb_focus, left
bind  = , up,    hyprexpo:kb_focus, up
bind  = , down,  hyprexpo:kb_focus, down
# confirm: release Super (real alt-tab feel) or press Enter
bindr = SUPER, Super_L, hyprexpo:kb_confirm
bindr = SUPER, Super_L, submap, reset
bind  = , Return, hyprexpo:kb_confirm
bind  = , Return, submap, reset
# cancel / close the overview
bind  = , Escape, hyprexpo:expo, toggle
bind  = , Escape, submap, reset
submap = reset
