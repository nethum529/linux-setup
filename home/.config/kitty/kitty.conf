allow_remote_control yes

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Transparency
background_opacity 0.45
background_blur 28
dynamic_background_opacity yes

# Slimmer box-drawing characters (defaults: 0.001 1 1.5 2)
# Lowering these makes borders / panel edges thinner.
box_drawing_scale 0.001, 0.5, 1, 1.5

# Rename current tab (easier than default ctrl+shift+alt+t)
map f2 set_tab_title
